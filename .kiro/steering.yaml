steering:
  - path: context/AGENTS.md
    description: "Primary AI agent instructions for this AlihSpec conversion project"
  - path: evaluate/framework-evaluation.md
    description: "Master Evaluation Guide: 16 Universal Conversion Pillars & 7 Golden Directives"
  - path: specs/architecture.md
    description: "Target project architecture — all output code must follow this"
  - path: context/RULES.md
    description: "Business and architectural rules registry"
  - path: context/conventions.md
    description: "Coding conventions for the target project"
  - path: .sdd/mapping/patterns.md
    description: "Design pattern mapping from source to target language"
  - path: context/qa-checklist.md
    description: "QA checklist to verify module conversion parity"
  - path: tasks/_index.md
    description: "Current task list and progress dashboard"

rules:
  - id: no-modify-source
    description: "Never modify files inside the source/ or reference-target/ folder"
    pattern: "{source/**,reference-target/**}"
    action: warn
    message: "⚠️ source/ and reference-target/ are read-only. Write all output to output/ instead."

  - id: output-only
    description: "All new implementation code must go into output/"
    message: "Write implementation code to output/, not anywhere else."

  - id: spec-first
    description: "Always read the spec and inspect source AST before implementing"
    message: "Before implementing a module, inspect source controller line-by-line and read specs/modules/[module].md first."

  - id: no-dummy-code
    description: "Strictly prohibit hardcoded dummy returns in repository/service layers"
    message: "Write real database queries with proper joins, aggregations, and row locks."

workflows:
  - name: "Convert Module"
    steps:
      - "Deep inspect source/[relevant controller] line-by-line"
      - "Read specs/modules/[module].md & verify against context/RULES.md"
      - "Check .sdd/mapping/patterns.md for concept mapping"
      - "Find task in tasks/_index.md, mark [/] in progress"
      - "Implement in output/ following Clean Architecture (Handler -> Service -> Repository -> Domain)"
      - "Validate against context/qa-checklist.md and mark task [x] done in tasks/_index.md"

